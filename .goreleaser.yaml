# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: show-cli

builds:
  - id: show
    main: ./cmd/show
    binary: show
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: show
    ids: [show]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # No version in the name, so releases/latest/download/<name> URLs stay stable.
    name_template: "show_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE-*

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "
